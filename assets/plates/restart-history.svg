<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" role="img" aria-labelledby="t d"><title id="t">Two histories behind one timeout</title><desc id="d">Both workers lose their connection. Before a write, the recovery check finds zero drafts. After the write, it finds one draft.</desc><rect width="400" height="232" fill="#000"/><g font-family="Arial,sans-serif" fill="#f1f1ed"><text x="15" y="24" font-size="18" font-weight="bold">What survived the timeout?</text><text x="15" y="48" fill="#b0b3ad" font-size="12">Follow request A17 across two possible histories.</text><g stroke="#566052" fill="none"><path d="M28 70 V171"/><path d="M28 95 H376 M28 164 H376" stroke-dasharray="3 4"/></g><g fill="#b9e6ae"><circle cx="28" cy="95" r="5"/><circle cx="28" cy="164" r="5"/></g><g fill="#000" stroke="#80877c"><rect x="51" y="79" width="135" height="31" rx="2"/><rect x="219" y="79" width="150" height="31" rx="2"/><rect x="51" y="148" width="135" height="31" rx="2"/><rect x="219" y="148" width="150" height="31" rx="2"/></g><g font-size="13"><text x="65" y="99">Before the write</text><text x="233" y="99">0 drafts on disk</text><text x="65" y="168">After the write</text><text x="233" y="168">1 draft on disk</text></g><g fill="#b9e6ae" font-size="12"><text x="219" y="128">Create it once.</text><text x="219" y="198">Verify what exists.</text></g><text x="15" y="224" fill="#a7aaa5" font-size="11">Observable state distinguishes the two recovery actions.</text></g></svg>
