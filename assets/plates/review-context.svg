<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 255" role="img" aria-labelledby="title desc">
<title id="title">Independent review of one revision</title><desc id="desc">An author supplies a fixed diff. A reviewer reads it in a fresh session. A finding leads to a repair and rerun. A clean result leads to a human decision.</desc>
