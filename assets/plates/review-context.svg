<g fill="#111410" stroke="#566553"><rect x="15" y="109" width="155" height="42" rx="4"/><rect x="191" y="109" width="238" height="42" rx="4"/><rect x="56" y="205" width="188" height="38" rx="4"/><rect x="284" y="205" width="157" height="38" rx="4"/></g>
<g font-family="Arial, sans-serif"><text x="16" y="33" fill="#b9e6ae" font-size="20">Review one fixed revision</text><text x="16" y="58" fill="#ced2ca" font-size="15">The reviewer starts with the diff and the test result.</text><g fill="#f4f4f0" font-size="16" text-anchor="middle"><text x="92" y="135">Author saves diff</text><text x="309" y="135">Reviewer opens fresh session</text><text x="151" y="230">Repair and rerun test</text><text x="363" y="230">Human decision</text></g><g fill="#b9e6ae" font-size="14"><text x="157" y="180">Finding</text><text x="348" y="180">Clean review</text></g></g></svg>