<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img"><rect width="420" height="250" fill="#111210"/><g font-family="Arial, sans-serif" fill="#f1f1ed"><text x="20" y="29" font-size="16" fill="#b9e6ae" font-weight="bold">Test the revision you review</text><rect x="20" y="66" width="116" height="81" fill="none" stroke="#747d72" stroke-width="1"/><text x="30" y="91" font-size="14" fill="#f1f1ed" font-weight="bold">Original</text><text x="30" y="119" font-size="13" fill="#b9e6ae" font-weight="normal">Test fails</text><rect x="152" y="66" width="116" height="81" fill="none" stroke="#747d72" stroke-width="1"/><text x="162" y="91" font-size="14" fill="#f1f1ed" font-weight="bold">Candidate</text><text x="162" y="119" font-size="13" fill="#b9e6ae" font-weight="normal">Test passes</text><rect x="284" y="66" width="116" height="81" fill="none" stroke="#747d72" stroke-width="1"/><text x="294" y="91" font-size="14" fill="#f1f1ed" font-weight="bold">Final revision</text><text x="294" y="119" font-size="13" fill="#b9e6ae" font-weight="normal">Run checks again</text><line x1="136" y1="106" x2="150" y2="106" stroke="#b9e6ae" stroke-width="2" /><line x1="268" y1="106" x2="282" y2="106" stroke="#b9e6ae" stroke-width="2" /><text x="20" y="186" font-size="14" fill="#f1f1ed" font-weight="normal">Keep the same failing input.</text><text x="20" y="210" font-size="14" fill="#f1f1ed" font-weight="normal">Record skipped checks and reasons.</text></g></svg>
