<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img"><rect width="420" height="250" fill="#111210"/><g font-family="Arial, sans-serif" fill="#f1f1ed"><text x="20" y="29" font-size="16" fill="#b9e6ae" font-weight="bold">An annotated prompt</text><text x="24" y="66" font-size="14" fill="#b9e6ae" font-weight="bold">Input</text><text x="132" y="66" font-size="14" fill="#f1f1ed" font-weight="normal">Failing command + revision</text><text x="24" y="105" font-size="14" fill="#b9e6ae" font-weight="bold">Constraint</text><text x="132" y="105" font-size="14" fill="#f1f1ed" font-weight="normal">Change one cause at a time</text><text x="24" y="144" font-size="14" fill="#b9e6ae" font-weight="bold">Verify</text><text x="132" y="144" font-size="14" fill="#f1f1ed" font-weight="normal">Repeat input + neighbor</text><text x="24" y="183" font-size="14" fill="#b9e6ae" font-weight="bold">Stop</text><text x="132" y="183" font-size="14" fill="#f1f1ed" font-weight="normal">Evidence cannot isolate cause</text></g></svg>
